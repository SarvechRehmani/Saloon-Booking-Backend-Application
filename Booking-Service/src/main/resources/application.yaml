server:
  port: 5005
spring:
  application:
    name: Booking-Service
  datasource:
    url: jdbc:mysql://localhost:3306/saloon_micro_booking_service?createDatabaseIfNotExist=true
    username: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    port: 5672
    host: localhost
    username: guest
    password: guest


eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
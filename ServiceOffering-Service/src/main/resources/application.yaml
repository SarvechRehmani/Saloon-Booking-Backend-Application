server:
  port: 5004
spring:
  application:
    name: ServiceOffering-Service
  datasource:
    url: jdbc:mysql://localhost:3306/saloon_micro_service_offering?createDatabaseIfNotExist=true
    username: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
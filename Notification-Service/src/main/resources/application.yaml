spring:
  application:
    name: Notification-Service
  server:
    port: 5007
  datasource:
    url: jdbc:mysql://localhost:3306/saloon_micro_notifications_service?createDatabaseIfNotExist=true
    username: root
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
  rabbitmq:
    port: 5672
    host: localhost
    username: guest
    password: guest

  eureka:
    instance:
      prefer-ip-address: true
    client:
      register-with-eureka: true
      fetch-registry: true
      serviceUrl:
        defaultZone: http://localhost:8761/eureka/
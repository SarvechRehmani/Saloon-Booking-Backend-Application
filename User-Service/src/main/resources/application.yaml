server:
  port: 5001
spring:
  application:
    name: User-Service

  datasource:
    url: jdbc:mysql://localhost:3306/saloon_micro_user_service?createDatabaseIfNotExist=true
    username: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/